<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omega Stream</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #141414; color: #fff; font-family: Arial, sans-serif; padding-bottom: 70px; }

        .navbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #181818; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #282828; }
        .logo { font-size: 16px; font-weight: bold; color: #e50914; cursor: pointer; }
        
        .search-container { position: relative; }
        .search-box input { width: 150px; background: #262626; border: 1px solid #404040; padding: 6px 10px; border-radius: 4px; color: #fff; font-size: 11px; outline: none; }
        .search-dropdown { position: absolute; top: 32px; right: 0; width: 220px; background: #1f1f1f; border: 1px solid #333; border-radius: 4px; z-index: 200; max-height: 200px; overflow-y: auto; display: none; }
        .search-suggestion-item { padding: 8px 10px; font-size: 11px; border-bottom: 1px solid #2a2a2a; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .search-suggestion-item:hover { background: #2a2a2a; }

        .categories { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; background: #141414; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-chip { background: #262626; color: #b3b3b3; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; white-space: nowrap; cursor: pointer; }
        .cat-chip.active { background: #fff; color: #000; }
        .cat-chip.adult { color: #ff4757; border: 1px solid #e50914; }
        .cat-chip.adult.active { background: #e50914; color: #fff; }

        #homeView { display: block; }
        
        .hero-slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; gap: 12px; padding: 10px 16px; }
        .hero-slider::-webkit-scrollbar { display: none; }
        .hero-banner { min-width: calc(100% - 32px); width: calc(100% - 32px); height: 350px; border-radius: 8px; overflow: hidden; position: relative; background: #000; scroll-snap-align: center; flex-shrink: 0; box-shadow: 0 6px 20px rgba(0,0,0,0.8); }
        .hero-img { width: 100%; height: 100%; object-fit: cover; }
        .hero-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 40px 16px 16px; background: linear-gradient(transparent, rgba(20,20,20,0.98)); }
        .hero-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #fff; }
        .play-btn { background: #fff; color: #000; font-weight: bold; font-size: 11px; padding: 8px 16px; border-radius: 4px; display: inline-block; cursor: pointer; }

        .section-title { margin: 18px 16px 8px; font-size: 13px; font-weight: bold; color: #fff; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .studios-row { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; }
        .studios-row::-webkit-scrollbar { display: none; }
        .studio-btn { min-width: 90px; height: 42px; background: #222; border: 1px solid #333; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; cursor: pointer; color: #fff; flex-shrink: 0; }

        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; padding: 0 16px; margin-top: 8px; }
        .movie-card { background: #1f1f1f; border-radius: 6px; overflow: hidden; cursor: pointer; border: 1px solid #2a2a2a; }
        .movie-card img { width: 100%; height: 195px; object-fit: cover; display: block; }
        .movie-info { padding: 8px; }
        .movie-name { font-size: 11px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }

        #watchView { display: none; padding: 16px; }
        .back-btn { background: #262626; color: #fff; border: 1px solid #404040; padding: 6px 14px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; margin-bottom: 14px; display: inline-block; }
        
        .player-container { position: relative; padding-bottom: 56.25%; height: 0; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid #333; margin-bottom: 12px; }
        .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        
        .watch-controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
        .server-btn { background: #e50914; color: #fff; border: none; padding: 8px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; text-decoration: none; display: inline-block; text-align: center; }
        .server-btn.secondary { background: #262626; border: 1px solid #404040; }
        .lang-select { background: #262626; color: #fff; border: 1px solid #404040; padding: 8px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; outline: none; cursor: pointer; }

        .watch-title { font-size: 18px; font-weight: bold; margin-bottom: 6px; color: #fff; }
        .watch-meta { font-size: 11px; color: #aaa; margin-bottom: 14px; }

        #historySection { display: none; padding: 16px; }
        .history-item { display: flex; align-items: center; justify-content: space-between; background: #1f1f1f; padding: 12px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #2a2a2a; }
        .del-btn { background: #e50914; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: bold; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #181818; border-top: 1px solid #282828; display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #808080; font-size: 10px; cursor: pointer; }
        .nav-item.active { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo" onclick="goHome()">OMEGA STREAM</div>
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search..." oninput="handleSearchInput()" autocomplete="off">
            </div>
            <div id="searchDropdown" class="search-dropdown"></div>
        </div>
    </div>

    <div id="homeView">
        <div class="categories">
            <div class="cat-chip active" onclick="loadTrending(this)">Trending</div>
            <div class="cat-chip" onclick="loadHindi(this)">Hindi Dubbed</div>
            <div class="cat-chip adult" onclick="toggleAdult(this)" id="adultChip">18+ Adult</div>
            <div class="cat-chip" onclick="loadAction(this)">Action</div>
        </div>

        <div class="hero-slider" id="heroSlider"></div>

        <div class="section-title">Studios</div>
        <div class="studios-row">
            <div class="studio-btn" onclick="fetchStudio('Marvel', 4203, true)">Marvel</div>
            <div class="studio-btn" onclick="fetchStudio('Disney', 2, false)">Disney</div>
            <div class="studio-btn" onclick="fetchStudio('Pixar', 3, false)">Pixar</div>
            <div class="studio-btn" onclick="fetchStudio('Warner', 3166, false)">Warner</div>
        </div>

        <div class="section-title" id="gridTitle">Trending Movies</div>
        <div class="movies-grid" id="moviesGrid"></div>
    </div>

    <div id="watchView">
        <div class="back-btn" onclick="goHome()">← Back to Home</div>
        <div class="player-container">
            <iframe id="videoPlayer" src="" allowfullscreen></iframe>
        </div>
        <div class="watch-controls">
            <button class="server-btn secondary" onclick="switchServer()" id="serverIndicator">Server: VidSrc CC</button>
            <a id="directWatchBtn" href="" target="_blank" class="server-btn">🚀 Open Direct Player</a>
            <select class="lang-select" id="langSelect" onchange="changeLanguage()">
                <option value="hi">🇮🇳 Hindi Audio</option>
                <option value="ta">🌴 Tamil Audio</option>
                <option value="en">🌐 English Audio</option>
            </select>
        </div>
        <div class="watch-title" id="watchTitle">Movie Title</div>
        <div class="watch-meta" id="watchMeta">Released • HD Quality</div>

        <div class="section-title" style="margin-left:0; margin-top:20px;">Recommended Content</div>
        <div class="movies-grid" id="recommendedGrid" style="padding:0;"></div>
    </div>

    <div id="historySection">
        <div class="section-title" style="margin-left:0; margin-bottom:10px;">Watch History</div>
        <div id="historyList"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)">
            <span>🏠 Home</span>
        </div>
        <div class="nav-item" onclick="switchTab('history', this)">
            <span>📜 History</span>
        </div>
        <div class="nav-item" onclick="switchTab('midnight', this)">
            <span>🔥 Midnight</span>
        </div>
    </div>

    <script>
        const API_KEY = '27c7f2de57c52dda225a91289f4b6ae2';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';

        let currentId = null;
        let currentType = 'movie';
        let currentTitle = '';
        let serverNum = 1;
        let adultMode = false;

        function fetchMovies(url) {
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if(data && data.results) {
                        renderSlider(data.results.slice(0, 5));
                        renderGrid(data.results, 'moviesGrid');
                    }
                })
                .catch(err => console.log('API Error:', err));
        }

        function loadTrending(el) {
            setActiveChip(el);
            document.getElementById('gridTitle').innerText = "Trending Movies";
            let url = `${BASE_URL}/trending/all/day?api_key=${API_KEY}`;
            if(adultMode) url += '&include_adult=true';
            fetchMovies(url);
        }

        function loadHindi(el) {
            setActiveChip(el);
            document.getElementById('gridTitle').innerText = "Hindi Dubbed Content";
            let url = `${BASE_URL}/discover/movie?api_key=${API_KEY}&with_original_language=hi&sort_by=popularity.desc`;
            if(adultMode) url += '&include_adult=true';
            fetchMovies(url);
        }

        function loadAction(el) {
            setActiveChip(el);
            document.getElementById('gridTitle').innerText = "Action Movies";
            let url = `${BASE_URL}/discover/movie?api_key=${API_KEY}&with_genres=28&sort_by=popularity.desc`;
            if(adultMode) url += '&include_adult=true';
            fetchMovies(url);
        }

        function loadHorror(el) {
            if(el) setActiveChip(el);
            document.getElementById('gridTitle').innerText = "Midnight Horror & Thriller";
            let url = `${BASE_URL}/discover/movie?api_key=${API_KEY}&with_genres=27,53&sort_by=popularity.desc`;
            if(adultMode) url += '&include_adult=true';
            fetchMovies(url);
        }

        function toggleAdult(el) {
            adultMode = !adultMode;
            if(adultMode) {
                el.className = 'cat-chip adult active';
                document.getElementById('gridTitle').innerText = "Adult Exclusive Content";
                fetchMovies(`${BASE_URL}/discover/movie?api_key=${API_KEY}&include_adult=true&with_genres=10749,35&sort_by=popularity.desc`);
            } else {
                el.className = 'cat-chip adult';
                loadTrending(document.querySelector('.cat-chip'));
            }
        }

        function setActiveChip(el) {
            const chips = document.querySelectorAll('.cat-chip');
            chips.forEach(c => {
                if(!c.classList.contains('adult')) c.classList.remove('active');
            });
            if(el && !el.classList.contains('adult')) el.classList.add('active');
            goHome();
        }

        function renderSlider(items) {
            const slider = document.getElementById('heroSlider');
            slider.innerHTML = '';
            items.forEach(item => {
                const title = item.title || item.name;
                const backdrop = item.backdrop_path ? IMG_URL + item.backdrop_path : (item.poster_path ? IMG_URL + item.poster_path : '');
                const banner = document.createElement('div');
                banner.className = 'hero-banner';
                banner.innerHTML = `
                    <img class="hero-img" src="${backdrop}" alt="${title}">
                    <div class="hero-overlay">
                        <div class="hero-title">${title}</div>
                        <div class="play-btn" onclick="openWatchView(${item.id}, '${item.media_type || 'movie'}', '${title.replace(/'/g, "")}')">▶ Play Now</div>
                    </div>
                `;
                slider.appendChild(banner);
            });
        }

        function renderGrid(items, elementId) {
            const grid = document.getElementById(elementId);
            grid.innerHTML = '';
            items.forEach(item => {
                if(!item.poster_path) return;
                const title = item.title || item.name;
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => openWatchView(item.id, item.media_type || 'movie', title.replace(/'/g, ""));
                card.innerHTML = `
                    <img src="${IMG_URL + item.poster_path}" alt="${title}">
                    <div class="movie-info">
                        <div class="movie-name">${title}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openWatchView(id, type, title) {
            currentId = id;
            currentType = type === 'tv' ? 'tv' : 'movie';
            currentTitle = title;
            serverNum = 1;

            document.getElementById('homeView').style.display = 'none';
            document.getElementById('historySection').style.display = 'none';
            document.getElementById('searchDropdown').style.display = 'none';
            document.getElementById('watchView').style.display = 'block';

            document.getElementById('watchTitle').innerText = title;
            document.getElementById('watchMeta').innerText = `${currentType.toUpperCase()} • HD Stream`;

            loadPlayer();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            saveHistory(id, title, currentType);

            fetch(`${BASE_URL}/${currentType}/${currentId}/recommendations?api_key=${API_KEY}`)
                .then(res => res.json())
                .then(data => {
                    if(data && data.results && data.results.length > 0) {
                        renderGrid(data.results, 'recommendedGrid');
                    }
                })
                .catch(err => console.log(err));
        }

        function loadPlayer() {
            const iframe = document.getElementById('videoPlayer');
            const directBtn = document.getElementById('directWatchBtn');
            const serverIndicator = document.getElementById('serverIndicator');
            const lang = document.getElementById('langSelect').value;
            
            let targetUrl = '';
            let serverName = '';

            if(serverNum === 1) {
                targetUrl = `https://vidsrc.cc/v2/embed/${currentType}/${currentId}?sub=${lang}&audio=${lang}`;
                serverName = 'Server: VidSrc CC';
            } else if(serverNum === 2) {
                targetUrl = `https://embed.su/embed/${currentType}/${currentId}`;
                serverName = 'Server: Embed.su';
            } else {
                targetUrl = `https://vidsrc.to/embed/${currentType}/${currentId}?lang=${lang}`;
                serverName = 'Server: VidSrc TO';
            }

            iframe.src = targetUrl;
            directBtn.href = targetUrl;
            serverIndicator.innerText = serverName;
        }

        function switchServer() {
            serverNum = (serverNum % 3) + 1;
            loadPlayer();
        }

        function changeLanguage() {
            if(currentId) loadPlayer();
        }

        function goHome() {
            document.getElementById('watchView').style.display = 'none';
            document.getElementById('historySection').style.display = 'none';
            document.getElementById('searchDropdown').style.display = 'none';
            document.getElementById('homeView').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleSearchInput() {
            const q = document.getElementById('searchInput').value;
            const dropdown = document.getElementById('searchDropdown');
            if(q.length > 1) {
                let url = `${BASE_URL}/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(q)}`;
                if(adultMode) url += '&include_adult=true';
                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        dropdown.innerHTML = '';
                        if(data && data.results && data.results.length > 0) {
                            dropdown.style.display = 'block';
                            data.results.slice(0, 6).forEach(item => {
                                const title = item.title || item.name;
                                const div = document.createElement('div');
                                div.className = 'search-suggestion-item';
                                div.innerText = title;
                                div.onclick = () => {
                                    document.getElementById('searchInput').value = title;
                                    dropdown.style.display = 'none';
                                    openWatchView(item.id, item.media_type || 'movie', title.replace(/'/g, ""));
                                };
                                dropdown.appendChild(div);
                            });
                        } else {
                            dropdown.style.display = 'none';
                        }
                    })
                    .catch(err => console.log(err));
            } else {
                dropdown.style.display = 'none';
            }
        }

        function fetchStudio(name, id, isMarvel) {
            goHome();
            document.getElementById('gridTitle').innerText = `${name} Showcase`;
            let url = '';
            if(isMarvel) {
                url = `${BASE_URL}/discover/movie?api_key=${API_KEY}&with_companies=4203&sort_by=popularity.desc`;
            } else {
                url = `${BASE_URL}/discover/movie?api_key=${API_KEY}&with_companies=${id}&sort_by=popularity.desc`;
            }
            if(adultMode) url += '&include_adult=true';
            
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if(data && data.results) {
                        let filtered = data.results;
                        if(isMarvel) {
                            filtered = data.results.filter(m => (m.title && m.title.toLowerCase().includes('marvel')) || (m.overview && m.overview.toLowerCase().includes('marvel')) || [299536, 299534, 99861, 284052, 49538,
